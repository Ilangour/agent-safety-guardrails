name: test
on: [push, pull_request]
jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: bash tests/agent-safety-tests.sh
      - run: npx -y bats@1.13.0 tests/guard.bats
